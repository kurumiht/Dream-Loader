; ==============================================================================
; Dream AoE Harvest - Server Mod Configuration (Farming Crop Gathering)
; Framework: dreamkurumiHT | Hot-Reload Enabled
; ==============================================================================

[AoEHarvest]
; เปิด/ปิด ระบบเก็บเกี่ยวพืชผลแบบกลุ่มรอบตัว (true / false)
Enabled=true

; รัศมีเก็บเกี่ยวพืชผลรอบแปลงเพาะปลูก (หน่วยเป็นเมตร: กำหนด 3.5m ตามที่ต้องการ)
Radius=3.5

; เก็บเกี่ยวเฉพาะพืชชนิดเดียวกันที่กด (true) หรือเก็บเกี่ยวพืชทุกชนิดที่โตเต็มที่รอบๆ (false)
SameCropOnly=false

; หากกด Shift ค้างไว้ขณะเก็บ จะเป็นการเก็บเดี่ยวแบบ Vanilla ทีละต้น
AllowShiftVanilla=true

; ปุ่มคีย์ลัดสำหรับเปิด/ปิด AoE Harvest (F8 = 0x77)
ToggleHotkey=F8

; กำหนดให้ใช้งานได้เฉพาะผู้ดูแลเซิร์ฟเวอร์ (Admin) หรือไม่ (false = ผู้เล่นทุกคนใช้ได้)
AdminOnly=false
